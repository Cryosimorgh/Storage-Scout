name: Build Windows executable
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Windows x64
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o StorageScout.exe .
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: StorageScout-Windows-x64
          path: StorageScout.exe
          retention-days: 30